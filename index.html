
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bolsas Internacionais</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        /* Custom scrollbar for better aesthetics */
        ::-webkit-scrollbar {
            width: 8px;
        }
        ::-webkit-scrollbar-track {
            background: #1a202c; /* Dark background */
        }
        ::-webkit-scrollbar-thumb {
            background: #4a5568; /* Darker grey thumb */
            border-radius: 4px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #6b7280; /* Lighter on hover */
        }
        /* Hide scrollbar for specific elements if needed, e.g., for tables that will have their own styling */
        .hide-scrollbar::-webkit-scrollbar {
            display: none;
        }
        .hide-scrollbar {
            -ms-overflow-style: none;  /* IE and Edge */
            scrollbar-width: none;  /* Firefox */
        }
    </style>
</head>
<body class="bg-gray-900 text-gray-100 font-sans leading-normal tracking-normal">
    <div id="app" class="container mx-auto p-4">

        <!-- Main Dashboard View -->
        <div id="dashboard-view">
            <h1 class="text-4xl font-bold text-center mb-8 text-blue-400">Bolsas Internacionais</h1>
            <div id="exchange-grid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
                <!-- Exchange cards will be loaded here by JavaScript -->
            </div>
        </div>

        <!-- Exchange Details View -->
        <div id="details-view" class="hidden">
            <div class="flex items-center mb-6">
                <button id="back-button" class="bg-blue-600 hover:bg-blue-700 text-white font-bold py-2 px-4 rounded-lg transition duration-300 mr-4">
                    &larr; Voltar
                </button>
                <h2 id="exchange-name" class="text-3xl font-bold text-blue-400"></h2>
            </div>
            
            <div class="overflow-x-auto bg-gray-800 rounded-lg shadow-md">
                <table class="min-w-full leading-normal">
                    <thead>
                        <tr>
                            <th class="px-5 py-3 border-b-2 border-gray-700 bg-gray-700 text-left text-xs font-semibold text-gray-200 uppercase tracking-wider">
                                Ticker
                            </th>
                            <th class="px-5 py-3 border-b-2 border-gray-700 bg-gray-700 text-left text-xs font-semibold text-gray-200 uppercase tracking-wider">
                                Nome do ETF
                            </th>
                            <th class="px-5 py-3 border-b-2 border-gray-700 bg-gray-700 text-left text-xs font-semibold text-gray-200 uppercase tracking-wider">
                                Preço Atual
                            </th>
                            <th class="px-5 py-3 border-b-2 border-gray-700 bg-gray-700 text-left text-xs font-semibold text-gray-200 uppercase tracking-wider">
                                Variação (%)
                            </th>
                        </tr>
                    </thead>
                    <tbody id="etfs-table-body">
                        <!-- ETF data will be loaded here by JavaScript -->
                    </tbody>
                </table>
            </div>
            <p class="mt-6 text-center text-sm text-gray-500">
                <span id="last-update-info"></span> - Os dados são atualizados mensalmente e possuem fins puramente informativos.
            </p>
        </div>

    </div>

    <script>
        const dashboardView = document.getElementById('dashboard-view');
        const detailsView = document.getElementById('details-view');
        const exchangeGrid = document.getElementById('exchange-grid');
        const exchangeNameHeader = document.getElementById('exchange-name');
        const etfsTableBody = document.getElementById('etfs-table-body');
        const backButton = document.getElementById('back-button');
        const lastUpdateInfo = document.getElementById('last-update-info');

        let allExchangesData = [];

        async function fetchExchangeData() {
            try {
                const response = await fetch('data.json');
                if (!response.ok) {
                    throw new Error(`HTTP error! status: ${response.status}`);
                }
                allExchangesData = await response.json();
                renderDashboard(allExchangesData);
            } catch (error) {
                console.error("Could not fetch exchange data:", error);
                exchangeGrid.innerHTML = `<p class="text-red-500 text-center col-span-full">Erro ao carregar os dados. Por favor, tente novamente mais tarde.</p>`;
            }
        }

        function renderDashboard(data) {
            exchangeGrid.innerHTML = ''; // Clear previous cards
            data.forEach(exchange => {
                const card = document.createElement('div');
                card.className = 'bg-gray-800 rounded-lg shadow-lg p-6 hover:bg-gray-700 transition duration-300 cursor-pointer text-center';
                card.innerHTML = `
                    <h3 class="text-xl font-semibold text-blue-300 mb-2">${exchange.name}</h3>
                    <p class="text-gray-400">${exchange.country}</p>
                `;
                card.addEventListener('click', () => showExchangeDetails(exchange.code));
                exchangeGrid.appendChild(card);
            });
        }

        function showExchangeDetails(exchangeCode) {
            const selectedExchange = allExchangesData.find(ex => ex.code === exchangeCode);
            if (selectedExchange) {
                exchangeNameHeader.textContent = selectedExchange.name;
                etfsTableBody.innerHTML = ''; // Clear previous rows
                
                let lastUpdatedDateTime = '';
                if (selectedExchange.etfs.length > 0 && selectedExchange.etfs[0].last_updated) {
                    const date = new Date(selectedExchange.etfs[0].last_updated);
                    lastUpdatedDateTime = `Atualizado em: ${date.toLocaleDateString('pt-BR')} ${date.toLocaleTimeString('pt-BR')}`;
                }
                lastUpdateInfo.textContent = lastUpdatedDateTime;

                selectedExchange.etfs.forEach(etf => {
                    const row = document.createElement('tr');
                    const changeClass = etf.change_percent >= 0 ? 'text-green-400' : 'text-red-400';
                    const changeArrow = etf.change_percent >= 0 ? '▲' : '▼';
                    const formattedPrice = etf.price ? `${etf.currency} ${etf.price.toLocaleString('pt-BR', { minimumFractionDigits: 2, maximumFractionDigits: 2 })}` : 'N/A';
                    const formattedChange = etf.change_percent ? `${changeArrow} ${etf.change_percent.toFixed(2)}%` : 'N/A';

                    row.className = 'hover:bg-gray-700';
                    row.innerHTML = `
                        <td class="px-5 py-5 border-b border-gray-700 bg-gray-800 text-sm">
                            <p class="text-white whitespace-no-wrap">${etf.ticker}</p>
                        </td>
                        <td class="px-5 py-5 border-b border-gray-700 bg-gray-800 text-sm">
                            <p class="text-white whitespace-no-wrap">${etf.name}</p>
                        </td>
                        <td class="px-5 py-5 border-b border-gray-700 bg-gray-800 text-sm">
                            <p class="text-white whitespace-no-wrap">${formattedPrice}</p>
                        </td>
                        <td class="px-5 py-5 border-b border-gray-700 bg-gray-800 text-sm ${changeClass}">
                            <p class="whitespace-no-wrap">${formattedChange}</p>
                        </td>
                    `;
                    etfsTableBody.appendChild(row);
                });

                dashboardView.classList.add('hidden');
                detailsView.classList.remove('hidden');
            }
        }

        backButton.addEventListener('click', () => {
            detailsView.classList.add('hidden');
            dashboardView.classList.remove('hidden');
        });

        // Initial data fetch when the page loads
        fetchExchangeData();
    </script>
</body>
</html>
